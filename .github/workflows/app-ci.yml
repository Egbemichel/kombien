name: App CI

# No path filters on purpose: `analyze-and-test` is a required status check
# on main, and a path-filtered workflow never reports on PRs that don't
# touch those paths, which would block them from merging forever.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to the version the app is built and deployed with
      # (deploy-pwa.yml). An unpinned "stable" moves under us: Flutter 3.50
      # deprecates package:flutter/material.dart, which made `flutter analyze`
      # fail on every PR at once. Move this and deploy-pwa.yml together.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
