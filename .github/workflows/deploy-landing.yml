name: Deploy landing page

# Publishes the Kombien landing page (kombien-landing/) to Cloudflare as the
# Worker "kombien-landing", served at egbemichel.tech/kombien (a path on the
# portfolio's domain; the app itself lives at kombien.egbemichel.tech).
# See kombien-landing/wrangler.toml and kombien-landing/README.md.
#
# Needs the same repository secrets as the app's deploy:
#   CLOUDFLARE_API_TOKEN   token from the "Edit Cloudflare Workers" template,
#                          with access to the egbemichel.tech zone for the route
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id

on:
  push:
    branches: [main]
    paths:
      - 'kombien-landing/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://egbemichel.tech/kombien/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: bash kombien-landing/scripts/build.sh

      - name: Deploy to Cloudflare
        working-directory: kombien-landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
