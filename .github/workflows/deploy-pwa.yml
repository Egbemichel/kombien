name: Deploy PWA

# Builds the Flutter app for the web with the kombien-pwa shell and publishes
# it to Cloudflare (Worker "kombien" serving static files, see
# kombien-pwa/wrangler.toml) at kombien.egbemichel.tech.
#
# Needs repository secrets:
#   CLOUDFLARE_API_TOKEN   token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id
# Optional (real backend; without them the site runs on sample data):
#   SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY
# Optional (Google place suggestions; without it the app never asks Google):
#   GOOGLE_PLACES_KEY, see docs/setup/google-places.md

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'kombien-pwa/**'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch:

concurrency:
  group: deploy-pwa
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://kombien.egbemichel.tech
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true

      - name: Build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
        run: bash kombien-pwa/scripts/build.sh

      - name: Deploy to Cloudflare
        working-directory: kombien-pwa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      # "Kombien has been updated" to riders who turned notifications on.
      # Only when the change says so: put [announce] in the PR title, so a
      # small fix does not ping everyone. Never fails the deploy.
      - name: Announce the update
        if: contains(github.event.head_commit.message, '[announce]')
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
          SHA: ${{ github.sha }}
        run: |
          curl -sS --fail-with-body --retry 3 -X POST \
            "$SUPABASE_URL/functions/v1/notify-unlocked" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "x-notify-secret: $NOTIFY_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"announce\":\"update\",\"key\":\"${SHA:0:12}\"}"
