name: Deploy PWA

# Builds the Flutter app for the web with the kombien-pwa shell and publishes
# it to Cloudflare (Worker "kombien" serving static files, see
# kombien-pwa/wrangler.toml) at kombien.egbemichel.tech.
#
# Needs repository secrets:
#   CLOUDFLARE_API_TOKEN   token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id
# Optional (real backend; without them the site runs on sample data):
#   SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'kombien-pwa/**'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch:

concurrency:
  group: deploy-pwa
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://kombien.egbemichel.tech
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true

      - name: Build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: bash kombien-pwa/scripts/build.sh

      - name: Deploy to Cloudflare
        working-directory: kombien-pwa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
