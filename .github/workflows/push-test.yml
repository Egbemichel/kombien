# By hand only: sends a real "Kombien has been updated" notification to every
# phone with notifications on, right now, to check that delivery works. Quiet
# hours and the daily limit do not apply to this test, and it leaves nothing
# behind in them, so normal behaviour (quiet hours, one a day, a reminder
# every 3 days) is unchanged. Run it from the Actions tab.
name: Push test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send the test update notification
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
        run: |
          test -n "$NOTIFY_SECRET" || { echo "NOTIFY_SECRET is not set"; exit 1; }
          curl -sS --fail-with-body --retry 3 -X POST \
            "$SUPABASE_URL/functions/v1/notify-unlocked" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "x-notify-secret: $NOTIFY_SECRET" \
            -H "Content-Type: application/json" -d '{"job":"test_update"}'
