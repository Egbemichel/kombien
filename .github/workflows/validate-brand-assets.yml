name: Validate brand assets

# No path filters on purpose: `validate` is a required status check on main,
# and a path-filtered workflow never reports on PRs that don't touch those
# paths, which would block them from merging forever.
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run brand asset validation
        run: node scripts/validate-brand-assets.mjs
